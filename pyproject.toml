[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oidc-sso-gateway"
version = "0.1.0"
description = "A small FastAPI SSO gateway that protects routes via the OpenID Connect Authorization Code flow, with a bundled mock IdP for offline use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["oidc", "openid-connect", "sso", "fastapi", "gateway", "jwt"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0"]

[tool.setuptools]
packages = ["ssogateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
